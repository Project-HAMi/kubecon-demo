apiVersion: v1
kind: Pod
metadata:
  name: gpu-pod-1
  annotations:
    nvidia.com/vgpu-mode: "mig"
spec:
  schedulerName: hami-scheduler
  containers:
    - name: ubuntu-container
      image: ubuntu:22.04
      command: ["bash", "-c", "sleep 86400"]
      resources:
        limits:
          nvidia.com/gpu: 1 
          nvidia.com/gpumem: 1000
