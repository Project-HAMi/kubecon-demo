apiVersion: apps/v1
kind: Deployment
metadata:
  name: qwen3-4b
spec:
  replicas: 2
  selector:
    matchLabels:
      app: qwen3-4b
  template:
    metadata:
      labels:
        app: qwen3-4b
      annotations:
        hami.io/node-scheduler-policy: binpack
        hami.io/gpu-scheduler-policy: binpack
    spec:
      containers:
        - name: qwen3-4b
          image: docker.m.daocloud.io/vllm/vllm-openai:v0.23.0
          imagePullPolicy: IfNotPresent
          env:
            - name: LIBCUDA_LOG_LEVEL
              value: "2"
            - name: GPU_CORE_UTILIZATION_POLICY
              value: force
            - name: VLLM_USE_MODELSCOPE
              value: "True"
          command:
            - vllm
            - serve
            - Qwen/Qwen3-4b
            - --dtype=auto
            - --max-model-len=1024
            - --enforce-eager
          resources:
            limits:
              nvidia.com/gpu: "1"
              nvidia.com/gpucores: "5"
              nvidia.com/gpumem: "10000"
      # nodeSelector:
      #   kubernetes.io/hostname: k8s-worker-2
---
apiVersion: v1
kind: Service
metadata:
  name: qwen3-4b
spec:
  selector:
    app: qwen3-4b
  ports:
    - protocol: TCP
      port: 8020
      targetPort: 8000
      name: vllm-svc
  type: ClusterIP
